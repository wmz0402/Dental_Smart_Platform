<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智护牙境 - 口腔智能感控平台</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('app_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (!isDark) {
            document.documentElement.classList.add('light-theme');
          } else {
            document.documentElement.classList.remove('light-theme');
          }
        } catch(e) {}
      })();
    </script>
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #090d16;
        color: #f8fafc;
      }
      html.light-theme, html.light-theme body {
        background-color: #f1f5f9;
        color: #0f172a;
      }
      #app-loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(11, 17, 32, 0.45);
        backdrop-filter: blur(16px) saturate(180%);
        -webkit-backdrop-filter: blur(16px) saturate(180%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99999;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: #f8fafc;
      }
      html.light-theme #app-loading-screen {
        background: rgba(248, 250, 252, 0.58);
        color: #0f172a;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-loading-screen">
        <div class="loading-box">
          <div class="loading-cube-wrapper">
            <div class="loading-cube"></div>
            <div class="loading-shadow"></div>
          </div>
          <div class="loading-title">智护牙境 · 口腔智能感控平台</div>
          <div class="loading-sub">系统初始化与数据接入中...</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
